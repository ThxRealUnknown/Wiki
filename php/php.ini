; Worldbuilder's own PHP configuration.
;
; This folder is a trimmed copy of a PHP 8.2 build — php.exe, the core DLL, and
; only the extensions this project actually uses. It exists so the project needs
; nothing installed at all: serve.bat prefers this PHP over anything on the
; machine.
;
; What was deliberately left out, and why:
;
;   intl      the ICU data file alone is 29 MB and nothing here uses it
;   curl      the app never makes an outbound HTTP request
;   gd        images are inspected with getimagesize, which is core
;   fileinfo  6.8 MB, and unused — uploads are checked with getimagesize
;   zip       only the unfinished .docx export would want it
;   pdo_mysql the app is SQLite-only now
;   openssl   was only here for MySQL's caching_sha2 authentication
;
; dom, libxml, xml and simplexml are compiled into php8ts.dll on this build
; rather than being separate DLLs, which is why the sanitiser and the exporters
; work with no extension line here.

; Relative to this file, so the folder can be copied anywhere.
extension_dir = "ext"

; --- what the project needs -------------------------------------------------

; Sanitiser, slugs, excerpts — anything counting characters rather than bytes.
extension = mbstring

; The database. No server, so nothing else is needed.
extension = pdo_sqlite

; --- behaviour ---------------------------------------------------------------

; A single-user local wiki: show mistakes rather than hiding them.
error_reporting = E_ALL
display_errors = On
log_errors = On

; Long rich-text fields and image uploads.
post_max_size = 32M
upload_max_filesize = 16M
max_execution_time = 120
memory_limit = 256M

; Backups and exports are built in memory before being sent.
default_charset = "UTF-8"

date.timezone = Europe/Berlin

; The built-in server is the only thing serving this, and it is single-user.
opcache.enable = 0
opcache.enable_cli = 0
